services:
  - type: web
    name: northstar-backend
    env: node
    rootDir: backend
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      # MONGODB_URI is optional. If left blank, it will use the in-memory fallback.
      # To persist data, add your MongoDB Atlas URL here or in the Render Dashboard.
      - key: MONGODB_URI
        sync: false
